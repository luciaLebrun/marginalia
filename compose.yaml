# The self-hosted stack (MRG-081): Postgres, a one-shot migrate job, the app.
# Secrets come from .env.selfhost (never committed); see .env.example.
#
#   docker compose --env-file .env.selfhost up -d --build

services:
  db:
    image: mirror.gcr.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marginalia
      POSTGRES_USER: marginalia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Sized for a 1 GB e2-micro that also runs the app.
    command: >
      postgres -c shared_buffers=64MB -c work_mem=2MB
      -c maintenance_work_mem=32MB -c max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginalia -d marginalia"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: tools }
    image: marginalia-tools
    environment: &env
      DATABASE_URL: postgresql://marginalia:${POSTGRES_PASSWORD}@db:5432/marginalia
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      MARGINALIA_OWNER_EMAIL: ${MARGINALIA_OWNER_EMAIL:-}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: app }
    image: marginalia-app
    restart: unless-stopped
    environment: *env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
