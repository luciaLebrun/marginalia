# The self-hosted stack (MRG-081): Postgres, a one-shot migrate job, the app.
# Secrets come from .env.selfhost (never committed); see .env.example.
#
#   docker compose --env-file .env.selfhost up -d --build

services:
  db:
    # Same major as Neon production (18), so its dumps restore without a downgrade.
    image: mirror.gcr.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marginalia
      POSTGRES_USER: marginalia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Sized for a 1 GB e2-micro that also runs the app.
    command: >
      postgres -c shared_buffers=64MB -c work_mem=2MB
      -c maintenance_work_mem=32MB -c max_connections=20
    volumes:
      # 18+ keeps data under /var/lib/postgresql/<major>/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginalia -d marginalia"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: tools }
    # Override with prebuilt GHCR images on the VM: docker compose pull && docker compose up -d --no-build
    image: ${TOOLS_IMAGE:-marginalia-tools}
    environment: &env
      DATABASE_URL: postgresql://marginalia:${POSTGRES_PASSWORD}@db:5432/marginalia
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      MARGINALIA_OWNER_EMAIL: ${MARGINALIA_OWNER_EMAIL:-}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: app }
    image: ${APP_IMAGE:-marginalia-app}
    restart: unless-stopped
    environment: *env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Public ingress on the VM only: a locally-managed named tunnel. Credentials
  # JSON is copied to deploy/cloudflared/ by hand (gitignored). The Mac stack
  # never starts it; the VM passes --profile tunnel.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
    depends_on:
      - app

volumes:
  pgdata:
