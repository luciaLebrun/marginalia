name: Image rescan

# Weekly rescan of the production images: CVEs published after a build still surface.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ghcr.io/lucialebrun/marginalia:latest
          - name: tools
            image: ghcr.io/lucialebrun/marginalia-tools:latest
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0  # the action defaults to v0.70.0; Dependabot cannot bump this input
          image-ref: ${{ matrix.image }}
          format: sarif
          ignore-unfixed: true
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.name }}

      - name: Scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0  # the action defaults to v0.70.0; Dependabot cannot bump this input
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
