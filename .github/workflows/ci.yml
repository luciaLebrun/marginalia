name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders. The app must not require a live database
          # to compile — if this breaks, something is reaching the DB at module
          # scope instead of at request time.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-only
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: quality
    # The secrets context is not available in a job-level `if`, so it is lifted
    # into env here and each step guards on it. Until SonarQube Cloud is set up,
    # this job reports a skip instead of a red X.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Report missing token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice title=SonarQube Cloud skipped::SONAR_TOKEN is not set." \
            "Create the project at https://sonarcloud.io, then add SONAR_TOKEN" \
            "to the repository secrets and set sonar.organization in" \
            "sonar-project.properties."

      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          # Sonar needs full history to attribute "new code" correctly.
          fetch-depth: 0

      - name: Download coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
