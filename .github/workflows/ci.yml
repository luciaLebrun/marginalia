name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Optional. When a DATABASE_URL secret exists, migrations are applied to
      # it and the integration suite runs against it; when it is absent those
      # tests skip themselves and the unit suite still passes.
      #
      # Point this at a dedicated Neon BRANCH, never production — the
      # integration tests write and delete rows, and the step below migrates it.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Without this, the CI database drifts behind the schema and every
      # migration breaks the integration suite until someone migrates that
      # branch by hand. Idempotent: drizzle-kit skips what is already applied.
      - name: Apply migrations
        if: env.DATABASE_URL != ''
        run: pnpm db:migrate

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders, overriding the job-level DATABASE_URL. The
          # app must not require a live database to compile — if this breaks,
          # something is reaching the DB at module scope instead of at request
          # time.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-only
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: quality
    # The secrets context is not available in a job-level `if`, so it is lifted
    # into env here and each step guards on it. Until SonarQube Cloud is set up,
    # this job reports a skip instead of a red X.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Report missing token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice title=SonarQube Cloud skipped::SONAR_TOKEN is not set." \
            "Create the project at https://sonarcloud.io, then add SONAR_TOKEN" \
            "to the repository secrets and set sonar.organization in" \
            "sonar-project.properties."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Sonar needs full history to attribute "new code" correctly.
          fetch-depth: 0

      - name: Download coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
