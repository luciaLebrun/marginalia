name: Image

# Builds the self-host images (linux/amd64), pushes them to GHCR and scans them with Trivy.
on:
  push:
    branches: [develop, main, "feature/MRG-081-*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tools image metadata
        id: meta-tools
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lucialebrun/marginalia-tools
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: App image metadata
        id: meta-app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lucialebrun/marginalia
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # tools first: app shares its deps stage, so it reuses this cache.
      - name: Build and push tools
        id: build-tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tools
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-tools.outputs.tags }}
          labels: ${{ steps.meta-tools.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max

      # Scan by digest: exactly what was just pushed. Pass 1 reports every
      # fixable finding to the Security tab; pass 2 fails the build on fixable CRITICALs.
      - name: Scan tools (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.75.0  # the action defaults to v0.70.0; Dependabot cannot bump this input
          image-ref: ghcr.io/lucialebrun/marginalia-tools@${{ steps.build-tools.outputs.digest }}
          format: sarif
          ignore-unfixed: true
          output: trivy-tools.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-tools.sarif
          category: trivy-tools

      - name: Scan tools (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.75.0  # the action defaults to v0.70.0; Dependabot cannot bump this input
          image-ref: ghcr.io/lucialebrun/marginalia-tools@${{ steps.build-tools.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Build and push app
        id: build-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=tools
          cache-to: type=gha,scope=app,mode=max

      # Scan by digest: exactly what was just pushed. Pass 1 reports every
      # fixable finding to the Security tab; pass 2 fails the build on fixable CRITICALs.
      - name: Scan app (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.75.0  # the action defaults to v0.70.0; Dependabot cannot bump this input
          image-ref: ghcr.io/lucialebrun/marginalia@${{ steps.build-app.outputs.digest }}
          format: sarif
          ignore-unfixed: true
          output: trivy-app.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-app.sarif
          category: trivy-app

      - name: Scan app (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.75.0  # the action defaults to v0.70.0; Dependabot cannot bump this input
          image-ref: ghcr.io/lucialebrun/marginalia@${{ steps.build-app.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
