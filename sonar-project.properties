sonar.projectKey=luciaLebrun_marginalia
sonar.organization=llebrun
sonar.projectName=Marginalia

sonar.sources=src
# Test files live beside the code they test (src/**/*.test.ts), not only in
# tests/. Without test.inclusions Sonar counts them as SOURCE and reports every
# test file as 0% covered — which is how new-code coverage read 16.6%.
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# pnpm-lock.yaml is 4809 of the 5933 analysed lines — 81% of the project by
# Sonar's count — and none of it is ours. Automatic Analysis picks it up; a
# CI-based scan is already scoped by sonar.sources, but exclude it either way.
sonar.exclusions=**/*.config.*,src/db/migrations/**,**/*.d.ts,src/app/**/layout.tsx,public/**,pnpm-lock.yaml,**/*.lock
# Excluded from COVERAGE only — still fully analysed for bugs and smells.
# These carry no branching logic to cover: schema.ts is table declarations,
# auth.ts and auth-client.ts are configuration objects, and src/app/** is UI
# that Playwright covers from phase 5.
sonar.coverage.exclusions=**/*.config.*,src/app/**,src/components/**,src/db/migrations/**,**/fixtures/**,src/db/schema.ts,src/lib/auth.ts,src/lib/auth-client.ts
