sonar.projectKey=luciaLebrun_marginalia
sonar.organization=llebrun
sonar.projectName=Marginalia

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# pnpm-lock.yaml is 4809 of the 5933 analysed lines — 81% of the project by
# Sonar's count — and none of it is ours. Automatic Analysis picks it up; a
# CI-based scan is already scoped by sonar.sources, but exclude it either way.
sonar.exclusions=**/*.config.*,src/db/migrations/**,**/*.d.ts,src/app/**/layout.tsx,public/**,pnpm-lock.yaml,**/*.lock
sonar.coverage.exclusions=**/*.config.*,src/app/**,src/components/**,src/db/migrations/**,**/fixtures/**
